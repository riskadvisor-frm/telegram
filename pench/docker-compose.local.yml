services:
  scraper:
    build: .
    container_name: pench
    restart: unless-stopped
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 4G # ! adjust as we increase workers
        reservations:
          memory: 1G # ! adjust as we increase workers

  pg:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    command: ["uv", "run", "pg"]
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  pg-dashboard:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    command: ["uv", "run", "pg-dashboard"]
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  scrape-dashboard:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    command: ["uv", "run", "scrape-dashboard"]
    ports:
      - "8005:8501"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

